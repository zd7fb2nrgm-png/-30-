
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>찾아가는 30주년 행사</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* =============================================
     ✏️ 색상 & 기본 설정 (필요하면 여기서 변경)
  ============================================= */
  :root {
    --bg: #fff8f4;
    --card-bg: #ffffff;
    --card-border: #f0d9cc;
    --accent-main: #FE6B01;
    --accent-teal: #e05500;
    --accent-rose: #c1404a;
    --text-primary: #1a1008;
    --text-secondary: #6b4a30;
    --text-muted: #b07a58;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    padding-bottom: 60px;
  }

  /* 상단 로고 */
  .top-logo {
    text-align: center;
    padding: 24px 24px 0;
  }
  .top-logo img {
    width: 180px;
    opacity: 0.9;
  }

  /* 상단 헤더 */
  .hero {
    padding: 56px 24px 16px;
    text-align: center;
    position: relative;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #FE6B01, #ffad6b);
  }
  .badge {
    display: inline-block;
    font-size: 15px;
    letter-spacing: 0.15em;
    color: var(--accent-main);
    border: 1px solid var(--accent-main);
    padding: 4px 14px;
    border-radius: 20px;
    margin-bottom: 20px;
    text-transform: uppercase;
    font-weight: 500;
  }
  .hero h1 {
    font-family: 'Noto Serif KR', serif;
    font-size: clamp(22px, 6vw, 30px);
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 16px;
    color: var(--text-primary);
  }
  .hero p {
    font-size: 17px;
    line-height: 1.9;
    color: var(--text-secondary);
    max-width: 460px;
    margin: 0 auto;
  }

  /* 섹션 구분선 */
  .section {
    padding: 0 20px;
    max-width: 560px;
    margin: 0 auto;
  }
  .section-title {
    font-size: 15px;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    text-transform: uppercase;
    font-weight: 500;
    margin: 40px 0 16px;
    padding-left: 4px;
  }


  /* 지도 */
  .map-section {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 20px;
  }
  .map-container {
    border: 1px solid var(--card-border);
    border-radius: 16px;
    overflow: hidden;
    margin-top: 8px;
  }
  #kakaoMap {
    width: 100%;
    height: 340px;
  }
  .map-title {
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    text-transform: uppercase;
    font-weight: 500;
    margin: 40px 0 16px;
    padding-left: 4px;
  }
  /* 전체 영상 카드 */
  .main-video-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    overflow: hidden;
  }
  .main-video-card .video-wrapper {
    position: relative;
    padding-bottom: 56.25%;
    background: #000;
  }
  .main-video-card .video-wrapper iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: none;
  }
  .main-video-card .video-info {
    padding: 16px 20px;
    border-top: 1px solid var(--card-border);
  }
  .main-video-card .video-info .label {
    font-size: 11px;
    color: var(--accent-teal);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 500;
    margin-bottom: 6px;
  }
  .main-video-card .video-info h2 {
    font-family: 'Noto Serif KR', serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--text-primary);
  }

  /* 지역별 카드 */
  .region-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }
  .region-card:hover {
    border-color: #FE6B01;
  }
  .region-card .video-wrapper {
    position: relative;
    padding-bottom: 56.25%;
    background: #000;
  }
  .region-card .video-wrapper iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: none;
  }
  .region-card .card-body {
    padding: 14px 18px 16px;
  }
  .region-card .region-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .region-num {
    font-family: 'Noto Serif KR', serif;
    font-size: 14px;
    color: var(--text-muted);
    font-weight: 500;
    letter-spacing: 0.08em;
  }
  .region-date {
    font-family: 'Noto Serif KR', serif;
    font-size: 14px;
    color: var(--text-muted);
  }
  .region-card h3 {
    font-family: 'Noto Serif KR', serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 4px;
  }
  .region-card .desc {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.7;
    margin-bottom: 12px;
  }
  .sketch-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--accent-teal);
    text-decoration: none;
    border: 1px solid rgba(254,107,1,0.4);
    padding: 6px 14px;
    border-radius: 20px;
    transition: background 0.2s;
    font-weight: 400;
  }
  .sketch-link:hover {
    background: rgba(254,107,1,0.08);
  }
  .sketch-link svg {
    width: 13px; height: 13px;
    stroke: var(--accent-main);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* 푸터 */
  .footer-logo {
    margin-bottom: 16px;
  }
  .footer-logo img {
    width: 150px;
    opacity: 0.75;
  }
  .footer {
    text-align: center;
    padding: 48px 24px 40px;
    font-size: 15px;
    color: var(--text-primary);
    line-height: 1.8;
  }
</style>
<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=fe8d26def9fdb12c9671af6b41eff05a&autoload=false"></script>
</head>

<!-- =============================================
     여기서부터는 수정 불필요

<div class="top-logo"><img src="logo.png" alt="월드비전 로고"></div>
<div class="hero" id="hero-section"></div>


<div class="map-section">
  <div class="map-container">
    <div id="kakaoMap"></div>
  </div>
</div>
<div id="sub-message" style="text-align:center;padding:32px 24px 0;font-size:17px;line-height:1.9;color:var(--text-secondary);max-width:460px;margin:0 auto;"></div>

<div class="section">
  <div class="section-title" id="main-label"></div>
  <div class="main-video-card" id="main-video-card"></div>

  <div class="section-title" id="region-label">지역별 영상 · 11개</div>
  <div id="region-list"></div>
</div>

<div class="footer" id="footer-section"></div>

<script>
// --- 히어로 렌더링 ---
const hero = document.getElementById('hero-section');
hero.innerHTML = `
  <div class="badge">${PAGE_CONFIG.badge}</div>
  <h1>${PAGE_CONFIG.title.replace('\n','<br>')}</h1>
`;
document.getElementById('sub-message').innerHTML = `
  <p>${PAGE_CONFIG.message.replace(/\n/g,'<br>')}</p>
`;

// --- 메인 영상 ---
document.getElementById('main-label').textContent = '전체 영상 · 1개';
const mainCard = document.getElementById('main-video-card');
mainCard.innerHTML = `
  <div class="video-wrapper">
    <iframe
      src="https://www.youtube.com/embed/${MAIN_VIDEO.youtubeId}?rel=0"
      title="${MAIN_VIDEO.title}"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>
  <div class="video-info">
    <div class="label">${MAIN_VIDEO.label}</div>
    <h2>${MAIN_VIDEO.title}</h2>
  </div>
`;

// --- 지역별 카드 ---
const regionList = document.getElementById('region-list');
REGIONS.forEach((r, i) => {
  const card = document.createElement('div');
  card.className = 'region-card';
  card.innerHTML = `
    <div class="video-wrapper">
      <iframe
        src="https://www.youtube.com/embed/${r.youtubeId}?rel=0"
        title="${r.region} 행사 영상"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>
    <div class="card-body">
      <div class="region-meta">
        <span class="region-num">${r.date}</span>
      </div>
      <h3>${r.region}</h3>
      ${r.desc && r.desc !== "." ? `<p class="desc">${r.desc}</p>` : ""}
      <a href="${r.sketchUrl}" target="_blank" class="sketch-link">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21,15 16,10 5,21"/></svg>
        스케치 사진 보기
      </a>
    </div>
  `;
  regionList.appendChild(card);
});


// --- 카카오맵 ---
kakao.maps.load(function() {
  var container = document.getElementById('kakaoMap');
  var options = {
    center: new kakao.maps.LatLng(36.5, 127.8),
    level: 13
  };
  var map = new kakao.maps.Map(container, options);

  var locations = [
    { name: "부산",     lat: 35.1796, lng: 129.0756 },
    { name: "강원(원주)", lat: 37.3422, lng: 127.9202 },
    { name: "구미",     lat: 36.1195, lng: 128.3446 },
    { name: "대구",     lat: 35.8714, lng: 128.6014 },
    { name: "대전",     lat: 36.3504, lng: 127.3845 },
    { name: "제주",     lat: 33.4996, lng: 126.5312 },
    { name: "서울(여의도)", lat: 37.5219, lng: 126.9245 },
    { name: "파주",     lat: 37.7599, lng: 126.7801 },
    { name: "창원",     lat: 35.2278, lng: 128.6811 },
    { name: "동탄",     lat: 37.2009, lng: 127.0724 }
  ];

  var imageSrc = 'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png';
  var imageSize = new kakao.maps.Size(24, 35);
  var markerImage = new kakao.maps.MarkerImage(imageSrc, imageSize);

  locations.forEach(function(loc) {
    var markerPosition = new kakao.maps.LatLng(loc.lat, loc.lng);
    var marker = new kakao.maps.Marker({
      position: markerPosition,
      image: markerImage,
      map: map
    });

    var infowindow = new kakao.maps.InfoWindow({
      content: '<div style="padding:4px 8px;font-size:12px;font-family:Noto Sans KR;font-weight:500;">' + loc.name + '</div>'
    });

    kakao.maps.event.addListener(marker, 'mouseover', function() {
      infowindow.open(map, marker);
    });
    kakao.maps.event.addListener(marker, 'mouseout', function() {
      infowindow.close();
    });
  });
});

// --- 푸터 ---
document.getElementById('footer-section').innerHTML = `
  <p>월드비전 · 찾아가는 30주년 </p>
  <p style="margin-top:10px">귀한 발걸음으로, 소중한 시간을 함께 나눠주셔서 진심으로 감사합니다. 🙏</p>
`;
</script>
